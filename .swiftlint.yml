# Template: copy this file into a child repo as `.swiftlint.yml`.
#
# All shared rules and thresholds come from the remote parent config below.
# SwiftLint fetches it over HTTPS on the first run and caches it; keep this
# file to repo-specific additions only (extra excluded paths, opt-in rules
# the repo wants, etc.). Anything set here overrides the parent.
parent_config: https://raw.githubusercontent.com/emotiveapps/codestyle/main/swift/.swiftlint.yml

# Exclusions live here, not in the parent: a parent's paths resolve against the parent's location and
# never reach this repo. Globs, not bare names: a bare `.build` covers only the root's, not every
# package's below it, and `swiftlint --fix` would then rewrite third-party checkouts.
# Add paths this repo alone needs skipped below these.
excluded:
  - "**/.build"
  - "**/.build-linux"
  - "**/.swiftpm"
  - "**/Derived"
