excluded:
  - .build

disabled_rules:
  # This is necessary when trying to keep long function signatures below 120 characters per line.
  - opening_brace

# Pragmatic thresholds (Aug 2026): errors only for egregious cases so builds
# stay green; warnings still nag. The legacy TUI (TransactionEditor et al.)
# is the main offender — tighten these when it gets refactored.
identifier_name:
  min_length:
    warning: 2  # single-char loop indices warn, never error
    error: 1
line_length:
  warning: 140
  error: 200
nesting:
  type_level:
    warning: 2  # nested Decodable response types are idiomatic
large_tuple:
  warning: 4
  error: 6
function_body_length:
  warning: 60
  error: 150
type_body_length:
  warning: 350
  error: 600
cyclomatic_complexity:
  warning: 12
  error: 10000  # never an error — warning-only by owner's preference

opt_in_rules:
  - number_separator

number_separator:
  minimum_length: 6  # Numbers with 6+ digits will require underscores

custom_rules:
  warnings_need_todo_prefix:
    included: ".*.swift"
    name: "Warning"
    regex: '(#warning\(")(?![ ]*TODO)'
    message: "Manual compiler warnings must start their message with \"TODO\" as a prefix."
    severity: error
